[project]
name = "pytest-testing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "olumide ilesanmi", email = "ilesanmiolumide10@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "requests>=2.34.2",
]

[project.scripts]
pytest-testing = "pytest_testing:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
